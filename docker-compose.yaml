services:
  mongodb:
    image: mongo:7.0.4
    container_name: portfolio-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db

  portfolio-api:
    build: .
    container_name: portfolio-api
    ports:
      - "8086:8086"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=portfolio-db
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=password
      - MONGO_AUTH_DB=admin
    depends_on:
      - mongodb

volumes:
  mongo_data:
