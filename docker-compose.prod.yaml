# Production stack for a single VPS: Caddy on the edge, the API behind it and
# MongoDB reachable by nobody but the API.
#
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --build
#
# Local development still uses docker-compose.yaml, which stays as it is.

name: portfolio-prod

# No container_name anywhere: compose derives the names from the project, so this
# stack can run next to the development one without fighting over them.
services:
  mongodb:
    image: mongo:7.0.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?define MONGO_USERNAME in .env.prod}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?define MONGO_PASSWORD in .env.prod}
    # No published ports on purpose: on a VPS, "ports:" would expose the database
    # to the whole internet because Docker writes its own iptables rules and walks
    # straight past ufw.
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  portfolio-api:
    build: .
    image: portfolio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-portfolio-db}
      MONGO_USERNAME: ${MONGO_USERNAME:?define MONGO_USERNAME in .env.prod}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?define MONGO_PASSWORD in .env.prod}
      MONGO_AUTH_DB: admin
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?define APP_CORS_ALLOWED_ORIGINS in .env.prod}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
    # Also no published ports: the only way in is through Caddy.
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?define API_DOMAIN in .env.prod}
      ADMIN_USER: ${ADMIN_USER:?define ADMIN_USER in .env.prod}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?run "docker run --rm caddy:2-alpine caddy hash-password --plaintext <password>"}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portfolio-api
    networks:
      - edge
    logging: *logging

networks:
  # internal: no route to the internet and no route from it. MongoDB lives here
  # alone with the API; the API reaches the outside through the edge network.
  backend:
    internal: true
  edge:

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
